name: desktop-build

on:
  push:
    branches: [dev, main]
    paths:
      - "AiMusicWorkstation.Desktop/**"
      - "AiMusicWorkstation.Application/**"
      - "AiMusicWorkstation.Domain/**"
      - "AiMusicWorkstation.Infrastructure/**"
      - "AiMusicWorkstation.Shared/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Desktop
        run: dotnet publish AiMusicWorkstation.Desktop/AiMusicWorkstation.Desktop.csproj -c Release -r win-x64 --self-contained false -o ${{ github.workspace }}\\publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiMusicWorkstation.Desktop-win-x64
          path: ${{ github.workspace }}\\publish
