name: desktop-build

on:
  push:
    branches: [dev]
    paths:
      - "AiMusicWorkstation.Desktop/**"
      - "AiMusicWorkstation.Application/**"
      - "AiMusicWorkstation.Domain/**"
      - "AiMusicWorkstation.Infrastructure/**"
      - "AiMusicWorkstation.Shared/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AiMusicWorkstation.slnx /p:EnableWindowsTargeting=true

      - name: Publish Desktop
        run: dotnet publish AiMusicWorkstation.Desktop/AiMusicWorkstation.Desktop.csproj -c Release -r win-x64 --self-contained true -o ${{ github.workspace }}\publish

      - name: Create Zip
        shell: pwsh
        run: |
          $releaseName = "AiMusicWorkstation.Desktop-win-x64-beta-${{ github.run_number }}"
          $zipPath = "${{ github.workspace }}\$releaseName.zip"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path "${{ github.workspace }}\publish\*" -DestinationPath $zipPath

          "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=desktop-beta-v${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub Prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: true
          generate_release_notes: true
          files: ${{ env.RELEASE_ZIP }}
