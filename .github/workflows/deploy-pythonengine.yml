name: Deploy PythonEngine to Azure VM

on:
  push:
    branches:
      - dev
    paths:
      - 'PythonEngine/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd Ai-Music-Workstation
            git fetch
            git pull origin dev
            cd PythonEngine
            source venv/bin/activate
            pip install -r requirements.txt

            if [ ! -f /etc/systemd/system/pythonengine.service ]; then
              sudo tee /etc/systemd/system/pythonengine.service > /dev/null <<'EOF'
            [Unit]
            Description=AI Music Workstation PythonEngine (Uvicorn)
            After=network.target

            [Service]
            Type=simple
            User=${{ secrets.AZURE_VM_USER }}
            WorkingDirectory=/home/${{ secrets.AZURE_VM_USER }}/Ai-Music-Workstation/PythonEngine
            ExecStart=/home/${{ secrets.AZURE_VM_USER }}/Ai-Music-Workstation/PythonEngine/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
            Restart=always
            RestartSec=5
            StandardOutput=append:/home/${{ secrets.AZURE_VM_USER }}/Ai-Music-Workstation/PythonEngine/uvicorn.log
            StandardError=append:/home/${{ secrets.AZURE_VM_USER }}/Ai-Music-Workstation/PythonEngine/uvicorn.log

            [Install]
            WantedBy=multi-user.target
            EOF
              sudo systemctl daemon-reload
              sudo systemctl enable pythonengine
            fi

            sudo fuser -k 8000/tcp 2>/dev/null || true
            sleep 2

            sudo systemctl restart pythonengine
            sleep 3
            sudo systemctl status pythonengine --no-pager
