name: deploy-api-azure

on:
  push:
    branches: [dev, main]
    paths:
      - "AiMusicWorkstation.Api/**"
      - "AiMusicWorkstation.Infrastructure/**"
      - "AiMusicWorkstation.Domain/**"
      - "AiMusicWorkstation.Shared/**"
      - ".github/workflows/deploy-api-azure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish API
        run: dotnet publish AiMusicWorkstation.Api/AiMusicWorkstation.Api.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish
